<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
        <table id="myTable">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Page Count</th>
                    <th>Read Book Yet?</th>
                </tr>
            </thead>
            <!-- <tbody></tbody> -->
        
        </table>
    <button class="open-button" type="button" onclick="openForm()">New Book</button>
    <div class="form-popup" id="myForm">
        <form class="form-container">
            <h1>Add a new book</h1>
            <fieldset>
                <label for="title">Title:* </label>
                <input type="text" placeholder="Enter Title of Book" name="title" required/>

                <label for="author">Author:* </label>
                <input type="text" placeholder="Enter Author of Book" name="author" required />

                <label for="pages">Page Count:* </label>
                <input type="number" placeholder="Enter Page Count of Book" name="pages" required />

                <input type="hidden" name="readYet" value="no">
                
                <label for="subscribe">I have read this book</label>
                <input type="checkbox" id="readYet" name="readYet" value="yes" >

                <button type="submit" class="btn">Submit</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Close</button>
            </fieldset>
        </form>
    </div>


</body>
</html>
